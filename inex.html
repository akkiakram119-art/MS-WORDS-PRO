<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
  <div class="container">
    <h1 >MS WORDS PRO</h1>
    <div id="tell">
      <select id="size">
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="12">12</option>
        <option value="14">14</option>
        <option value="16">16</option>
        <option value="18">18</option>
        <option value="20">20</option>
        <option value="22">22</option>
        <option value="24">24</option>
        <option value="26">26</option>
        <option value="28">28</option>
        <option value="36">36</option> 
        <option value="48">48</option>       
        <option value="72">72</option>
      </select>

       <button id="bold"><b>B</b></button>
      <button id="underline"><u>U</u></button>
      <button id="italic"><i>I</i></button>
      <button id="clear">Clear</button>

       <input type="color" id="color">
      
      <select id="font+">
        <option>Arial</option>
        <option>Calibri</option>
        <option>Algerian</option>
        <option>Aatrix OCRB</option>
        <option>Brush Script MT</option>
        <option>CommercialScript BT</option>
        <option>Goudy Stout</option>
        <option>Bradley Hand ITC</option>
      </select>
      <img src="./buskit.png" id="print">
      <input type="color" id="bg">
      <div id="same">
        <button id="left"><img src="./right.png" alt=""></button>
        <button id="right"><img src="./center.png" alt=""></button>
        <button id="justify"><img src="./line.png" alt=""></button>
        <button id="center"><img src="./left.png" alt=""></button>
      </div>
    </div>
    <p id="para" contenteditable="true">
       Start typing here...

    </p>

  </div> 
    
  


 
  <script src="./app.js"></script>
</body>
</html>
